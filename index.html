<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Finora V3</title><style>
:root{--bg:#080c16;--p:#111827;--p2:#0d1524;--line:#263247;--txt:#eef2ff;--mut:#91a0b8;--acc:#7894ff;--good:#35d49a;--bad:#fb7185;--warn:#f5c451}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#182448 0,#080c16 38%);color:var(--txt);font-family:system-ui,Tahoma,sans-serif}.side{position:fixed;right:0;top:0;bottom:0;width:230px;background:#0b101bfa;border-left:1px solid var(--line);padding:20px 12px;z-index:10}.brand{font-size:23px;font-weight:900;padding:7px 10px 22px}.brand i{color:var(--acc);font-style:normal}.nav button,.mob button{display:block;width:100%;border:0;background:none;color:var(--mut);padding:11px 12px;border-radius:12px;text-align:right;margin:3px 0}.nav button.active,.nav button:hover,.mob button.active{background:#1a2540;color:#fff}.main{margin-right:230px;padding:22px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.top h1{margin:0;font-size:25px}.top small{color:var(--mut)}.live{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}.dot{width:8px;height:8px;background:var(--good);border-radius:50%;box-shadow:0 0 10px var(--good)}button,.btn{border:1px solid var(--line);background:#182238;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.primary{background:#647ff0!important;border-color:#647ff0!important}.danger{background:#451b27!important}.view{display:none}.view.active{display:block}.grid{display:grid;gap:13px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:linear-gradient(180deg,#131d2f,#0d1523);border:1px solid var(--line);border-radius:18px;padding:16px}.label,.muted{color:var(--mut)}.big{font-size:25px;font-weight:850;margin:8px 0}.good{color:var(--good)}.bad{color:var(--bad)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#1b2942;color:#b9c6dd;font-size:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.mini{background:#0c1422;border:1px solid var(--line);border-radius:13px;padding:12px}.progress{height:9px;background:#202b3e;border-radius:20px;overflow:hidden}.progress b{display:block;height:100%;background:linear-gradient(90deg,#708aff,#43d5a2)}table{width:100%;border-collapse:collapse}th,td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{color:var(--mut)}.wrap{overflow:auto}.notice{background:#121d31;border:1px solid var(--line);border-radius:12px;padding:11px;color:#b9c5da;line-height:1.8;font-size:12px}.chart{height:245px}.chart svg{width:100%;height:100%}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:var(--mut);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#09111e;border:1px solid #2a3950;color:#fff;border-radius:9px;padding:10px}.field textarea{min-height:100px}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap}.mob{display:none}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:#2a3b68}.empty{text-align:center;color:var(--mut);padding:25px}@media(max-width:900px){.side{display:none}.main{margin:0;padding:13px 13px 78px}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.mob{display:flex;position:fixed;bottom:0;right:0;left:0;background:#0b111cf7;border-top:1px solid var(--line);z-index:20;justify-content:space-around;padding:5px}.mob button{width:auto;text-align:center;font-size:10px;margin:0}.mob span{display:block;font-size:17px}.form{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:520px){.g2{grid-template-columns:1fr}.top h1{font-size:20px}.big{font-size:21px}.card{padding:13px}}
</style></head><body><aside class="side"><div class="brand">FIN<i>ORA</i><small style="display:block;font-size:10px;color:#7f8ca5;font-weight:500">Portfolio Command Center V3</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="title">داشبورد</h1><small id="sub">نمای کلی سرمایه</small></div><div class="live"><i class="dot"></i><span id="status">آماده</span><button onclick="refresh()">↻</button></div></header><section id="dashboard" class="view active"></section><section id="safe" class="view"></section><section id="trading" class="view"></section><section id="analysis" class="view"></section><section id="assets" class="view"></section><section id="trades" class="view"></section><section id="plans" class="view"></section><section id="market" class="view"></section><section id="settings" class="view"></section></main><nav class="mob" id="mob"></nav><script>
const KEY='finora_v3';const menu=[['dashboard','⌂','داشبورد'],['safe','🛡','دارایی امن'],['trading','↗','در گردش'],['analysis','◒','تحلیل'],['assets','◆','دارایی‌ها'],['trades','⇄','معاملات'],['plans','🎯','برنامه‌ها'],['market','⌁','بازار'],['settings','⚙','مدیریت']];
const seed={settings:{safe:'BTC',target:2},assets:[{id:'btc',name:'بیت‌کوین',sym:'BTC',cat:'کریپتو',unit:'BTC',price:92000,source:'Binance',live:true},{id:'eth',name:'اتریوم',sym:'ETH',cat:'کریپتو',unit:'ETH',price:3300,source:'Binance',live:true},{id:'gold',name:'طلای ۱۸ عیار',sym:'GOLD18',cat:'طلا',unit:'گرم',price:12200000,source:'TGJU / API سفارشی',live:false},{id:'usd',name:'دلار آزاد',sym:'USD',cat:'ارز',unit:'تومان',price:103200,source:'API سفارشی',live:false},{id:'usdt',name:'تتر',sym:'USDT',cat:'کریپتو',unit:'USDT',price:99000,source:'Binance',live:false},{id:'oil',name:'نفت برنت',sym:'BRENT',cat:'کالا',unit:'دلار',price:74,source:'API سفارشی',live:false}],hold:[{asset:'btc',qty:.42,avg:82000,type:'safe'},{asset:'gold',qty:18.5,avg:10500000,type:'trade'},{asset:'usdt',qty:1850,avg:95000,type:'trade'}],trades:[{id:'1',sym:'BTC',entry:82000,exit:92000,qty:.12,status:'CLOSED'},{id:'2',sym:'GOLD18',entry:11800000,exit:11500000,qty:5,status:'CLOSED'},{id:'3',sym:'USDT',entry:96000,exit:0,qty:850,status:'OPEN'}],plans:[{sym:'BTC',min:89000,max:90000,stop:85000,target:105000},{sym:'GOLD18',min:11800000,max:12100000,stop:11400000,target:13500000}],history:[1290,1320,1305,1370,1390,1415,1428]};
let D=load(),cur='dashboard',range=7;function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(D))}function A(s){return D.assets.find(a=>a.sym===s)||D.assets.find(a=>a.id===s)}function M(n){return Number(n||0).toLocaleString('fa-IR',{maximumFractionDigits:2})}function V(h){let a=D.assets.find(x=>x.id===h.asset);return a?h.qty*a.price:0}function TV(){return D.hold.reduce((s,h)=>s+V(h),0)}function SV(){return D.hold.filter(h=>h.type==='safe').reduce((s,h)=>s+V(h),0)}function SQ(){return D.hold.filter(h=>h.type==='safe'&&D.assets.find(a=>a.id===h.asset)?.sym===D.settings.safe).reduce((s,h)=>s+h.qty,0)}function RP(){return D.trades.reduce((s,t)=>s+(t.status==='CLOSED'?(t.exit-t.entry)*t.qty:0),0)}function UP(){return D.hold.reduce((s,h)=>{let a=D.assets.find(x=>x.id===h.asset);return s+(a?(a.price-h.avg)*h.qty:0)},0)}
function nav(){document.getElementById('nav').innerHTML=menu.map(x=>`<button data-v="${x[0]}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('');document.getElementById('mob').innerHTML=menu.slice(0,5).map(x=>`<button data-v="${x[0]}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');sync()}function sync(){document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===cur))}function go(v){cur=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');let m=menu.find(x=>x[0]===v);document.getElementById('title').textContent=m[2];document.getElementById('sub').textContent={dashboard:'نمای کلی سرمایه',safe:'هدف نهایی سرمایه‌گذاری',trading:'دارایی‌ها و معاملات در گردش',analysis:'روند سود و ارزش',assets:'بانک دارایی و منبع قیمت',trades:'دفتر معاملات',plans:'معاملات قبل از ورود',market:'تابلو بازار',settings:'تنظیمات و بکاپ'}[v];sync();render();scrollTo(0,0)}
function chart(vals){let mn=Math.min(...vals),mx=Math.max(...vals),w=700,h=230,p=18,pts=vals.map((v,i)=>`${p+i*(w-2*p)/Math.max(1,vals.length-1)},${h-p-(v-mn)/Math.max(1,mx-mn)*(h-2*p)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#7894ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function render(){dash();safe();trading();analysis();assets();trades();plans();market();settings()}
function dash(){let tv=TV(),sv=SV(),sq=SQ(),tar=+D.settings.target||1;document.getElementById('dashboard').innerHTML=`<div class="grid g4"><div class="card"><div class="label">ارزش کل</div><div class="big">${M(tv)}</div><small class="muted">تومان</small></div><div class="card"><div class="label">سود بسته</div><div class="big ${RP()>=0?'good':'bad'}">${M(RP())}</div></div><div class="card"><div class="label">سود/زیان باز</div><div class="big ${UP()>=0?'good':'bad'}">${M(UP())}</div></div><div class="card"><div class="label">پوزیشن باز</div><div class="big">${D.trades.filter(t=>t.status==='OPEN').length}</div></div></div><div class="grid g2" style="margin-top:13px"><div class="card"><div class="row"><div><span class="muted">🛡 دارایی امن</span><h2 style="margin:7px 0">${D.settings.safe}</h2></div><span class="pill">${M(sq)} / ${M(tar)}</span></div><div class="progress"><b style="width:${Math.min(100,sq/tar*100)}%"></b></div><div class="row" style="margin-top:8px"><small>پیشرفت</small><b>${(Math.min(100,sq/tar*100)).toFixed(1)}٪</b></div></div><div class="card"><div class="row"><div><span class="muted">🔄 سرمایه در گردش</span><h2 style="margin:7px 0">${M(tv-sv)}</h2></div><span class="pill">فعال</span></div><div class="grid g2"><div class="mini"><span class="muted">سود امروز</span><b class="good">${M(RP()/7)}</b></div><div class="mini"><span class="muted">سود هفته</span><b class="good">${M(RP())}</b></div></div></div></div><div class="grid g3" style="margin-top:13px"><div class="card"><div class="row"><b>روند ارزش</b><span class="pill">۷ روز</span></div><div class="chart">${chart(D.history)}</div></div><div class="card"><b>دارایی‌های اصلی</b>${D.hold.slice(0,5).map(h=>{let a=D.assets.find(x=>x.id===h.asset);return `<div class="row"><span>${a.name}<small class="muted"> · ${a.sym}</small></span><b>${M(V(h))}</b></div>`}).join('')}</div><div class="card"><b>برنامه‌های نزدیک</b>${D.plans.map(p=>{let a=A(p.sym),hit=a&&a.price>=p.min&&a.price<=p.max;return `<div class="row"><span>${p.sym}</span><span class="pill ${hit?'good':''}">${hit?'ورود فعال':'انتظار'}</span></div>`}).join('')||'<div class="empty">ندارد</div>'}</div></div>`}
function safe(){let a=A(D.settings.safe),q=SQ(),tar=+D.settings.target||1;document.getElementById('safe').innerHTML=`<div class="grid g3"><div class="card"><span class="muted">دارایی امن</span><h2>${D.settings.safe}</h2><div class="big">${M(q)} ${a?.unit||''}</div><div class="progress"><b style="width:${Math.min(100,q/tar*100)}%"></b></div><p class="muted">هدف ${M(tar)} ${D.settings.safe}</p></div><div class="card"><span class="muted">ارزش</span><div class="big">${M(SV())}</div><p class="muted">سودهای منتقل‌شده می‌توانند به این سبد اضافه شوند.</p></div><div class="card"><span class="muted">انتقال</span><p>برای افزایش دارایی امن، مقدار را به موجودی همین سبد اضافه کن.</p><button class="primary" onclick="transfer()">+ ثبت انتقال</button></div></div><div class="card" style="margin-top:13px"><b>موجودی امن</b>${D.hold.filter(h=>h.type==='safe').map(h=>{let a=D.assets.find(x=>x.id===h.asset);return `<div class="row"><span>${a.name}</span><b>${M(h.qty)} ${a.unit} · ${M(V(h))}</b></div>`}).join('')||'<div class="empty">خالی</div>'}</div>`}
function transfer(){let sym=prompt('نماد دارایی امن:',D.settings.safe),q=+prompt('مقدار:',0);if(!q)return;let a=A(sym);if(!a)return alert('دارایی وجود ندارد');let h=D.hold.find(x=>x.asset===a.id&&x.type==='safe');if(!h){h={asset:a.id,qty:0,avg:a.price,type:'safe'};D.hold.push(h)}h.qty+=q;h.avg=a.price;save();render()}
function trading(){let rows=D.hold.filter(h=>h.type!=='safe');document.getElementById('trading').innerHTML=`<div class="grid g4"><div class="card"><span class="label">سرمایه در گردش</span><div class="big">${M(TV()-SV())}</div></div><div class="card"><span class="label">سود بسته</span><div class="big good">${M(RP())}</div></div><div class="card"><span class="label">سود باز</span><div class="big ${UP()>=0?'good':'bad'}">${M(UP())}</div></div><div class="card"><span class="label">معاملات</span><div class="big">${D.trades.length}</div></div></div><div class="card" style="margin-top:13px"><div class="row"><b>دارایی‌های در گردش</b><button class="primary" onclick="tradeForm()">+ معامله</button></div><div class="wrap"><table><tr><th>دارایی</th><th>مقدار</th><th>قیمت</th><th>ارزش</th><th>سود</th></tr>${rows.map(h=>{let a=D.assets.find(x=>x.id===h.asset),p=(a.price-h.avg)*h.qty;return `<tr><td>${a.name}</td><td>${M(h.qty)}</td><td>${M(a.price)}</td><td>${M(V(h))}</td><td class="${p>=0?'good':'bad'}">${M(p)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">خالی</td></tr>'}</table></div></div>`}
function analysis(){let v=D.history.slice(-range),g=v[v.length-1]-v[0],gp=v[0]?g/v[0]*100:0;document.getElementById('analysis').innerHTML=`<div class="tabs">${[1,7,30,99].map(x=>`<button class="${range===x?'active':''}" onclick="range=${x};analysis()">${x===1?'۱ روز':x===7?'۷ روز':x===30?'۳۰ روز':'همه'}</button>`).join('')}</div><div class="grid g4"><div class="card"><span class="label">رشد ارزش</span><div class="big ${gp>=0?'good':'bad'}">${gp.toFixed(2)}٪</div></div><div class="card"><span class="label">تغییر ارزش</span><div class="big">${M(g)}</div></div><div class="card"><span class="label">سود بسته</span><div class="big good">${M(RP())}</div></div><div class="card"><span class="label">سود باز</span><div class="big ${UP()>=0?'good':'bad'}">${M(UP())}</div></div></div><div class="grid g2" style="margin-top:13px"><div class="card"><div class="row"><b>نمودار ارزش پرتفوی</b><span class="pill">${range}D</span></div><div class="chart">${chart(v)}</div></div><div class="card"><b>عملکرد دارایی‌ها</b>${D.hold.map(h=>{let a=D.assets.find(x=>x.id===h.asset),p=(a.price-h.avg)*h.qty;return `<div class="row"><span>${a.name}</span><b class="${p>=0?'good':'bad'}">${M(p)}</b></div>`}).join('')}</div></div><div class="card" style="margin-top:13px"><b>Benchmark</b><div class="notice" style="margin-top:8px">ساختار مقایسه آماده است؛ بعد از اتصال منابع قیمت می‌توان عملکرد پرتفوی را با BTC، طلا، دلار یا شاخص‌های دیگر مقایسه کرد.</div></div>`}
function assets(){document.getElementById('assets').innerHTML=`<div class="grid g2"><div class="card"><div class="row"><b>بانک دارایی‌ها</b><button class="primary" onclick="assetForm()">+ افزودن دارایی</button></div><div class="wrap"><table><tr><th>دارایی</th><th>دسته</th><th>قیمت</th><th>منبع</th><th></th></tr>${D.assets.map(a=>`<tr><td><b>${a.name}</b><small class="muted"> · ${a.sym}</small></td><td>${a.cat}</td><td>${M(a.price)}</td><td>${a.source} ${a.live?'🟢':''}</td><td><button onclick="assetForm('${a.id}')">ویرایش</button></td></tr>`).join('')}</table></div></div><div class="card"><b>بانک آماده دارایی</b><div class="notice" style="margin-top:10px">طلا ۱۸، ارز، کریپتو، بورس و کالا می‌توانند از قبل در بانک باشند. هر دارایی یک منبع قیمت اصلی و وضعیت Live دارد.</div>${['کریپتو','طلا','ارز','بورس','کالا','سایر'].map(c=>`<div class="mini" style="margin-top:8px"><span>${c}</span><b>${D.assets.filter(a=>a.cat===c).length}</b></div>`).join('')}</div></div>`}
function assetForm(id){let a=id?D.assets.find(x=>x.id===id):{id:'a'+Date.now(),name:'',sym:'',cat:'کریپتو',unit:'واحد',price:0,source:'',live:false};let n=prompt('نام:',a.name);if(n===null)return;let s=prompt('نماد:',a.sym);if(s===null)return;let c=prompt('دسته:',a.cat)||a.cat;let u=prompt('واحد:',a.unit)||a.unit;let p=+prompt('قیمت:',a.price);if(!isFinite(p))return;let src=prompt('منبع قیمت یا API endpoint:',a.source)||a.source;let live=confirm('Live/API فعال باشد؟');Object.assign(a,{name:n,sym:s.toUpperCase(),cat:c,unit:u,price:p,source:src,live});if(!id)D.assets.push(a);save();render()}
function trades(){document.getElementById('trades').innerHTML=`<div class="row" style="margin-bottom:12px"><b>دفتر معاملات</b><button class="primary" onclick="tradeForm()">+ ثبت معامله</button></div><div class="card wrap"><table><tr><th>نماد</th><th>وضعیت</th><th>ورود</th><th>خروج</th><th>مقدار</th><th>سود</th><th></th></tr>${D.trades.map(t=>`<tr><td>${t.sym}</td><td>${t.status}</td><td>${M(t.entry)}</td><td>${t.exit?M(t.exit):'—'}</td><td>${M(t.qty)}</td><td class="${(t.exit-t.entry)>=0?'good':'bad'}">${M(t.status==='CLOSED'?(t.exit-t.entry)*t.qty:0)}</td><td><button onclick="tradeForm('${t.id}')">ویرایش</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">خالی</td></tr>'}</table></div>`}
function tradeForm(id){let t=id?D.trades.find(x=>x.id===id):{id:Date.now(),sym:'BTC',entry:0,exit:0,qty:0,status:'OPEN'};let s=prompt('نماد:',t.sym);if(s===null)return;let e=+prompt('ورود:',t.entry),q=+prompt('مقدار:',t.qty),st=prompt('OPEN یا CLOSED:',t.status)||t.status,x=t.exit;if(st==='CLOSED')x=+prompt('خروج:',t.exit||0);if(!isFinite(e)||!isFinite(q))return;Object.assign(t,{sym:s.toUpperCase(),entry:e,qty:q,status:st,exit:x});if(!id)D.trades.push(t);save();render()}
function plans(){document.getElementById('plans').innerHTML=`<div class="row" style="margin-bottom:12px"><b>برنامه ورود</b><button class="primary" onclick="planForm()">+ برنامه</button></div><div class="grid g2">${D.plans.map(p=>{let a=A(p.sym),curp=a?.price||0,hit=curp>=p.min&&curp<=p.max;return `<div class="card"><div class="row"><h3>${p.sym}</h3><span class="pill">${hit?'ورود فعال':'در انتظار'}</span></div><div class="grid g2"><div class="mini"><small>ورود</small><b>${M(p.min)} — ${M(p.max)}</b></div><div class="mini"><small>قیمت</small><b>${M(curp)}</b></div><div class="mini"><small>حد ضرر</small><b>${M(p.stop)}</b></div><div class="mini"><small>هدف</small><b>${M(p.target)}</b></div></div></div>`}).join('')||'<div class="card empty">برنامه‌ای نیست</div>'}</div>`}
function planForm(){let s=prompt('نماد:','BTC');if(!s)return;let a=A(s),min=+prompt('حد پایین:'),max=+prompt('حد بالا:'),stop=+prompt('حد ضرر:'),target=+prompt('هدف:');D.plans.push({sym:s.toUpperCase(),min,max,stop,target});save();render()}
function market(){document.getElementById('market').innerHTML=`<div class="notice">🟢 BTC و ETH در این نسخه از API عمومی Binance قیمت زنده می‌گیرند. برای دلار، طلای ایران، بورس و نفت، API منبع را در مدیریت تنظیم کن. کلید خصوصی API نباید داخل GitHub Pages قرار بگیرد.</div><div class="card" style="margin-top:13px"><div class="row"><b>تابلو بازار</b><button class="primary" onclick="refresh()">↻ بروزرسانی</button></div><div class="wrap"><table><tr><th>دارایی</th><th>قیمت</th><th>منبع</th><th>وضعیت</th></tr>${D.assets.map(a=>`<tr><td>${a.name}<small class="muted"> · ${a.sym}</small></td><td>${M(a.price)}</td><td>${a.source}</td><td>${a.live?'🟢 Live':'⚙ دستی/API'}</td></tr>`).join('')}</table></div></div>`}
function settings(){document.getElementById('settings').innerHTML=`<div class="grid g2"><div class="card"><h3>هدف دارایی امن</h3><div class="form"><div class="field"><label>دارایی امن</label><select id="safe">${D.assets.map(a=>`<option ${a.sym===D.settings.safe?'selected':''}>${a.sym}</option>`).join('')}</select></div><div class="field"><label>هدف</label><input id="target" type="number" value="${D.settings.target}"></div></div><button class="primary" onclick="setGoal()">ذخیره</button></div><div class="card"><h3>منابع قیمت</h3><div class="notice">منبع اصلی را برای هر دارایی مشخص کن. برای API خصوصی از Proxy امن استفاده کن.</div>${D.assets.map(a=>`<div class="row"><span><b>${a.sym}</b><small class="muted"> · ${a.name}</small></span><button onclick="editSource('${a.id}')">${a.live?'Live':'Manual'}</button></div>`).join('')}</div><div class="card"><h3>Backup / Restore</h3><div class="actions"><button class="primary" onclick="backup()">⬇ Backup</button><label class="btn">⬆ Restore<input hidden type="file" accept=".json" onchange="restore(event)"></label><button class="danger" onclick="reset()">حذف همه</button></div></div><div class="card"><h3>ذخیره‌سازی</h3><div class="mini"><span class="muted">حافظه</span><b>LocalStorage</b></div><p class="muted">اطلاعات در همین مرورگر ذخیره می‌شود و Backup برای انتقال به دستگاه دیگر ضروری است.</p></div></div>`}
function setGoal(){D.settings.safe=document.getElementById('safe').value;D.settings.target=+document.getElementById('target').value||0;save();render()};function editSource(id){let a=D.assets.find(x=>x.id===id);a.source=prompt('منبع/API:',a.source)||a.source;a.live=confirm('Live فعال؟');save();render()}
async function refresh(){document.getElementById('status').textContent='در حال دریافت...';let n=0;for(const a of D.assets.filter(x=>x.live&&['BTC','ETH'].includes(x.sym))){try{let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol='+a.sym+'USDT',{cache:'no-store'});if(r.ok){let j=await r.json();a.price=+j.price;n++}}catch(e){}}D.plans.forEach(p=>{let a=A(p.sym);if(a)p.current=a.price});save();render();document.getElementById('status').textContent=n?'Live: '+new Date().toLocaleTimeString('fa-IR'):'منبع Live پاسخ نداد'}
function backup(){let b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='finora-backup.json';a.click()}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();render();alert('بازیابی شد')}catch{alert('فایل نامعتبر است')}};r.readAsText(f)}function reset(){if(confirm('همه داده‌ها حذف شوند؟')){D=structuredClone(seed);save();render()}}
nav();render();refresh();
</script></body></html>
