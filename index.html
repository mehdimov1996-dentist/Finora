<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>Finora | مدیریت مالی</title>
<style>
:root{--bg:#0b0d12;--p:#151a24;--p2:#1b2230;--b:#2b3444;--t:#f4f6fa;--m:#9aa4b4;--g:#35d07f;--r:#ff6477;--bl:#5ba7ff;--y:#e7b84b;--rad:17px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,Tahoma,sans-serif}.app{max-width:1150px;margin:auto;padding:15px 13px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.logo{font-size:25px;font-weight:900}.sub{font-size:11px;color:var(--m)}.nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;z-index:5;padding:7px 0;background:#0b0d12eF}.nav button,.btn{border:1px solid var(--b);background:var(--p);color:var(--t);border-radius:11px;padding:9px 12px;white-space:nowrap}.nav button.active{background:#263149;border-color:#456080}.page{display:none}.page.active{display:block}.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--p);border:1px solid var(--b);border-radius:var(--rad);padding:14px}.label,.mini{font-size:11px;color:var(--m)}.big{font-size:23px;font-weight:850;margin-top:5px}.green{color:var(--g)}.red{color:var(--r)}.blue{color:var(--bl)}.gold{color:var(--y)}h2{font-size:16px;margin:0 0 11px}.section{margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:11px;color:var(--m);margin-bottom:4px}input,select,textarea{width:100%;background:#0e1219;border:1px solid var(--b);color:#fff;border-radius:10px;padding:9px}textarea{min-height:80px}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.primary{background:#2e82e8!important}.success{background:#208d58!important}.danger{background:#762838!important}.pill{font-size:10px;color:var(--m);background:#242b38;padding:5px 8px;border-radius:99px}.progress{height:8px;background:#282f3a;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--g))}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:8px 5px;border-bottom:1px solid var(--b);text-align:right}.empty{text-align:center;color:var(--m);padding:16px}.chart{width:100%;height:220px}.toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#252d3b;border:1px solid #455064;padding:10px 15px;border-radius:12px;z-index:20}
@media(max-width:780px){.g4{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}.form{grid-template-columns:1fr}.big{font-size:20px}}
</style></head><body><div class="app">
<header class="top"><div><div class="logo">FINORA</div><div class="sub">دفترچه مدیریت مالی شخصی + سرمایه‌گذاری</div></div><button class="btn" onclick="live()">↻ بازار</button></header>
<nav class="nav"><button class="active" data-p="home">🏠 خانه</button><button data-p="wallet">💳 کیف پول</button><button data-p="invest">📈 سرمایه‌گذاری</button><button data-p="analysis">📊 تحلیل</button><button data-p="settings">⚙️ تنظیمات</button></nav>
<section id="home" class="page active"></section><section id="wallet" class="page"></section><section id="invest" class="page"></section><section id="analysis" class="page"></section><section id="settings" class="page"></section></div><div id="toast" class="toast"></div>
<script>
const K='finora_full_v4';const fresh={wallet:{income:[],expense:[],transfer:[],budget:[]},invest:{safe:{asset:'BTC',current:0,target:2},assets:[],trades:[]},month:new Date().toISOString().slice(0,7)};let S=(()=>{try{return JSON.parse(localStorage.getItem(K))||fresh}catch(e){return fresh}})();
const $=id=>document.getElementById(id), save=()=>{localStorage.setItem(K,JSON.stringify(S));render()}, id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6), n=x=>Number(x||0), money=x=>n(x).toLocaleString('fa-IR')+' تومان', esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[a])), toast=x=>{$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)};
function inc(){return S.wallet.income.filter(x=>x.date.startsWith(S.month)).reduce((a,x)=>a+n(x.amount),0)}
function exp(){return S.wallet.expense.filter(x=>x.date.startsWith(S.month)).reduce((a,x)=>a+n(x.amount),0)}
function tr(){return S.wallet.transfer.filter(x=>x.date.startsWith(S.month)).reduce((a,x)=>a+n(x.amount),0)}
function balance(){return inc()-exp()-tr()}
function cats(){return ['خانه','غذا و رستوران','حمل‌ونقل','خودرو','خرید','تفریح','سلامت','قبوض و اینترنت','اقساط','سفر','هدیه','آموزش','سایر']}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(b.dataset.p).classList.add('active');render()});
function renderHome(){let I=inc(),E=exp(),T=tr(),savev=I-E,iv=S.invest.assets.reduce((a,x)=>a+n(x.qty)*n(x.price),0),sp=S.invest.safe.target?n(S.invest.safe.current)/n(S.invest.safe.target)*100:0;
$('home').innerHTML=`<div class="grid g4"><div class="card"><div class="label">درآمد ماه</div><div class="big green">${money(I)}</div></div><div class="card"><div class="label">هزینه ماه</div><div class="big red">${money(E)}</div></div><div class="card"><div class="label">پس‌انداز</div><div class="big blue">${money(savev)}</div></div><div class="card"><div class="label">سرمایه‌گذاری</div><div class="big gold">${money(T)}</div></div></div>
<div class="grid g2 section"><div class="card"><div class="row"><h2>🛡 دارایی امن</h2><span class="pill">${esc(S.invest.safe.asset)}</span></div><div class="big">${n(S.invest.safe.current).toLocaleString()} / ${n(S.invest.safe.target).toLocaleString()}</div><div class="progress" style="margin-top:10px"><i style="width:${Math.min(100,sp)}%"></i></div><div class="mini">${sp.toFixed(1)}٪ از هدف</div></div>
<div class="card"><h2>⚡ شاخص‌های کلیدی</h2><div class="list"><div class="row"><span>نرخ پس‌انداز</span><b class="green">${I?(savev/I*100).toFixed(1):0}٪</b></div><div class="row"><span>نرخ سرمایه‌گذاری</span><b class="gold">${I?(T/I*100).toFixed(1):0}٪</b></div><div class="row"><span>مانده کیف پول</span><b>${money(balance())}</b></div><div class="row"><span>ارزش دارایی‌ها</span><b>${money(iv)}</b></div></div></div></div>
<div class="grid g2 section"><div class="card"><h2>📊 هزینه‌های ماه</h2><canvas id="hc" class="chart"></canvas></div><div class="card"><h2>🎯 مسیر مالی</h2><p class="mini">درآمد → هزینه‌های ضروری → پس‌انداز → انتقال به سرمایه‌گذاری → دارایی امن</p><div class="item">پول وارد شده از کیف پول به سرمایه‌گذاری: <b class="gold">${money(T)}</b></div></div></div>`;drawCosts('hc')}
function renderWallet(){let cs=cats();$('wallet').innerHTML=`<div class="grid g4"><div class="card"><div class="label">درآمد</div><div class="big green">${money(inc())}</div></div><div class="card"><div class="label">هزینه</div><div class="big red">${money(exp())}</div></div><div class="card"><div class="label">سرمایه‌گذاری</div><div class="big gold">${money(tr())}</div></div><div class="card"><div class="label">مانده</div><div class="big blue">${money(balance())}</div></div></div>
<div class="grid g2 section"><div class="card"><h2>➕ درآمد</h2><form class="form" onsubmit="income(event)"><div><label>مبلغ</label><input name="amount" type="number" required></div><div><label>نوع</label><select name="type"><option>درآمد دندانپزشکی</option><option>حقوق</option><option>درآمد جانبی</option><option>سود دریافتی</option><option>سایر</option></select></div><div><label>تاریخ</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>توضیح</label><input name="note"></div><div class="full"><button class="btn success">ثبت درآمد</button></div></form></div>
<div class="card"><h2>➖ هزینه</h2><form class="form" onsubmit="expense(event)"><div><label>مبلغ</label><input name="amount" type="number" required></div><div><label>دسته</label><select name="cat">${cs.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>تاریخ</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>توضیح</label><input name="note"></div><div class="full"><button class="btn danger">ثبت هزینه</button></div></form></div></div>
<div class="card section"><h2>🔄 انتقال به سرمایه‌گذاری</h2><form class="form" onsubmit="transfer(event)"><div><label>مبلغ</label><input name="amount" type="number" required></div><div><label>مقصد</label><select name="dest"><option>سرمایه در گردش</option><option>دارایی امن</option></select></div><div><label>تاریخ</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>توضیح</label><input name="note" placeholder="سرمایه‌گذاری ماهانه"></div><div class="full"><button class="btn primary">ثبت انتقال</button></div></form></div>
<div class="grid g2 section"><div class="card"><h2>📋 تراکنش‌های ماه</h2>${walletList()}</div><div class="card"><h2>🎯 بودجه هزینه‌ها</h2>${budgets(cs)}</div></div>`}
function income(e){e.preventDefault();let f=new FormData(e.target);S.wallet.income.push({id:id(),amount:n(f.get('amount')),type:f.get('type'),date:f.get('date'),note:f.get('note')});save();toast('درآمد ثبت شد')}
function expense(e){e.preventDefault();let f=new FormData(e.target);S.wallet.expense.push({id:id(),amount:n(f.get('amount')),cat:f.get('cat'),date:f.get('date'),note:f.get('note')});save();toast('هزینه ثبت شد')}
function transfer(e){e.preventDefault();let f=new FormData(e.target),a=n(f.get('amount'));if(a>balance()){toast('موجودی کیف پول کافی نیست');return}S.wallet.transfer.push({id:id(),amount:a,dest:f.get('dest'),date:f.get('date'),note:f.get('note')});save();toast('انتقال ثبت شد')}
function walletList(){let a=[...S.wallet.income.filter(x=>x.date.startsWith(S.month)).map(x=>({...x,k:'income',title:x.type})),...S.wallet.expense.filter(x=>x.date.startsWith(S.month)).map(x=>({...x,k:'expense',title:x.cat})),...S.wallet.transfer.filter(x=>x.date.startsWith(S.month)).map(x=>({...x,k:'transfer',title:'انتقال به '+x.dest}))].sort((a,b)=>b.date.localeCompare(a.date));if(!a.length)return'<div class="empty">تراکنشی ثبت نشده</div>';return`<table class="table"><tr><th>تاریخ</th><th>عنوان</th><th>مبلغ</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td class="${x.k==='income'?'green':x.k==='expense'?'red':'gold'}">${x.k==='expense'?'−':'+'}${money(x.amount)}</td><td><button class="btn danger" onclick="del('${x.k}','${x.id}')">×</button></td></tr>`).join('')}</table>`}
function del(k,i){let key=k==='income'?'income':k==='expense'?'expense':'transfer';S.wallet[key]=S.wallet[key].filter(x=>x.id!==i);save()}
function budgets(cs){return cs.slice(0,8).map(c=>{let b=S.wallet.budget.find(x=>x.cat===c)?.amount||0,s=S.wallet.expense.filter(x=>x.date.startsWith(S.month)&&x.cat===c).reduce((a,x)=>a+n(x.amount),0),p=b?Math.min(100,s/b*100):0;return`<div class="card" style="padding:9px;margin-bottom:7px"><div class="row"><span>${c}</span><span class="mini">${b?money(s)+' / '+money(b):'بدون بودجه'}</span></div><div class="progress" style="margin-top:6px"><i style="width:${p}%"></i></div><button class="btn" style="margin-top:6px" onclick="budget('${c}')">تعیین بودجه</button></div>`}).join('')}
function budget(c){let v=prompt('بودجه ماهانه '+c);if(v===null)return;let x=S.wallet.budget.find(x=>x.cat===c);if(x)x.amount=n(v);else S.wallet.budget.push({cat:c,amount:n(v)});save()}
function renderInvest(){let a=S.invest.assets,v=a.reduce((s,x)=>s+n(x.qty)*n(x.price),0),safe=S.invest.safe;$('invest').innerHTML=`<div class="grid g3"><div class="card"><div class="label">دارایی امن</div><div class="big gold">${n(safe.current)} ${esc(safe.asset)}</div><div class="mini">هدف ${n(safe.target)}</div></div><div class="card"><div class="label">ارزش دارایی‌های در گردش</div><div class="big">${money(v)}</div></div><div class="card"><div class="label">معاملات</div><div class="big blue">${S.invest.trades.length}</div></div></div>
<div class="grid g2 section"><div class="card"><h2>🛡 هدف دارایی امن</h2><form class="form" onsubmit="safe(event)"><div><label>دارایی</label><input name="asset" value="${esc(safe.asset)}"></div><div><label>مقدار فعلی</label><input name="current" type="number" step="any" value="${safe.current}"></div><div><label>هدف</label><input name="target" type="number" step="any" value="${safe.target}"></div><div><button class="btn success">ذخیره</button></div></form></div>
<div class="card"><h2>➕ دارایی</h2><form class="form" onsubmit="asset(event)"><div><label>نام</label><input name="name" required placeholder="طلای ۱۸"></div><div><label>نماد</label><input name="symbol" required placeholder="GERAM18"></div><div><label>دسته</label><select name="type"><option>کریپتو</option><option>طلا</option><option>ارز</option><option>بورس</option><option>نفت</option><option>سایر</option></select></div><div><label>مقدار</label><input name="qty" type="number" step="any" value="0"></div><div><label>قیمت</label><input name="price" type="number" step="any" value="0"></div><div><button class="btn primary">افزودن</button></div></form></div></div>
<div class="card section"><h2>💰 دارایی‌ها</h2>${a.length?`<table class="table"><tr><th>نام</th><th>دسته</th><th>مقدار</th><th>قیمت</th><th>ارزش</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.name)}<span class="mini"> ${esc(x.symbol)}</span></td><td>${esc(x.type)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(n(x.qty)*n(x.price))}</td><td><button class="btn danger" onclick="da('${x.id}')">×</button></td></tr>`).join('')}</table>`:'<div class="empty">دارایی ثبت نشده</div>'}</div>
<div class="card section"><h2>📈 ثبت معامله</h2><form class="form" onsubmit="trade(event)"><div><label>نماد</label><input name="symbol" required placeholder="BTC"></div><div><label>وضعیت</label><select name="status"><option value="open">باز</option><option value="closed">بسته</option></select></div><div><label>ورود</label><input name="entry" type="number"></div><div><label>خروج</label><input name="exit" type="number"></div><div><label>سود/زیان</label><input name="pnl" type="number"></div><div><label>تاریخ</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="full"><button class="btn primary">ثبت معامله</button></div></form>${trades()}</div>`}
function safe(e){e.preventDefault();let f=new FormData(e.target);S.invest.safe={asset:f.get('asset'),current:n(f.get('current')),target:n(f.get('target'))};save()}
function asset(e){e.preventDefault();let f=new FormData(e.target);S.invest.assets.push({id:id(),name:f.get('name'),symbol:f.get('symbol'),type:f.get('type'),qty:n(f.get('qty')),price:n(f.get('price'))});save()}
function da(i){S.invest.assets=S.invest.assets.filter(x=>x.id!==i);save()}
function trade(e){e.preventDefault();let f=new FormData(e.target);S.invest.trades.push({id:id(),symbol:f.get('symbol'),status:f.get('status'),entry:n(f.get('entry')),exit:n(f.get('exit')),pnl:n(f.get('pnl')),date:f.get('date')});save()}
function trades(){if(!S.invest.trades.length)return'<div class="empty">معامله‌ای ثبت نشده</div>';return`<table class="table"><tr><th>نماد</th><th>وضعیت</th><th>P/L</th><th></th></tr>${S.invest.trades.slice().reverse().map(x=>`<tr><td>${esc(x.symbol)}</td><td>${x.status==='open'?'باز':'بسته'}</td><td class="${x.pnl>=0?'green':'red'}">${money(x.pnl)}</td><td><button class="btn danger" onclick="dt('${x.id}')">×</button></td></tr>`).join('')}</table>`}
function dt(i){S.invest.trades=S.invest.trades.filter(x=>x.id!==i);save()}
function renderAnalysis(){let ms=[];for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);let k=d.toISOString().slice(0,7);ms.push([k,tot('income',k),tot('expense',k),tot('transfer',k)])}$('analysis').innerHTML=`<div class="grid g3"><div class="card"><div class="label">درآمد ماه</div><div class="big green">${money(inc())}</div></div><div class="card"><div class="label">هزینه ماه</div><div class="big red">${money(exp())}</div></div><div class="card"><div class="label">نرخ سرمایه‌گذاری</div><div class="big gold">${inc()?(tr()/inc()*100).toFixed(1):0}٪</div></div></div><div class="grid g2 section"><div class="card"><h2>📈 روند ۶ ماهه</h2><canvas id="mc" class="chart"></canvas></div><div class="card"><h2>📊 ترکیب هزینه</h2><canvas id="cc" class="chart"></canvas></div></div><div class="card section"><h2>📅 گزارش ماهانه</h2><table class="table"><tr><th>ماه</th><th>درآمد</th><th>هزینه</th><th>سرمایه‌گذاری</th><th>مانده</th></tr>${ms.map(x=>`<tr><td>${x[0]}</td><td class="green">${money(x[1])}</td><td class="red">${money(x[2])}</td><td class="gold">${money(x[3])}</td><td>${money(x[1]-x[2]-x[3])}</td></tr>`).join('')}</table></div>`;drawMonth('mc',ms);drawCosts('cc')}
function tot(k,m){return S.wallet[k].filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+n(x.amount),0)}
function drawCosts(id){let c=$(id);if(!c)return;let ctx=c.getContext('2d'),W=c.clientWidth*devicePixelRatio,H=c.clientHeight*devicePixelRatio;c.width=W;c.height=H;ctx.clearRect(0,0,W,H);let d={};S.wallet.expense.filter(x=>x.date.startsWith(S.month)).forEach(x=>d[x.cat]=(d[x.cat]||0)+n(x.amount));let a=Object.entries(d).sort((x,y)=>y[1]-x[1]).slice(0,7),mx=Math.max(1,...a.map(x=>x[1]));ctx.font=11*devicePixelRatio+'px sans-serif';a.forEach((x,i)=>{let y=(15+i*27)*devicePixelRatio;ctx.fillStyle='#9aa4b4';ctx.fillText(x[0],5*devicePixelRatio,y+11*devicePixelRatio);ctx.fillStyle='#5ba7ff';ctx.fillRect(110*devicePixelRatio,y,W*.72*x[1]/mx,14*devicePixelRatio);ctx.fillStyle='#fff';ctx.fillText((x[1]/1e6).toFixed(1)+'M',118*devicePixelRatio,y+11*devicePixelRatio)})}
function drawMonth(id,a){let c=$(id);if(!c)return;let ctx=c.getContext('2d'),W=c.clientWidth*devicePixelRatio,H=c.clientHeight*devicePixelRatio;c.width=W;c.height=H;ctx.clearRect(0,0,W,H);let mx=Math.max(1,...a.flatMap(x=>x.slice(1)));[['#35d07f',1],['#ff6477',2],['#e7b84b',3]].forEach(([col,j])=>{ctx.strokeStyle=col;ctx.lineWidth=2*devicePixelRatio;ctx.beginPath();a.forEach((x,i)=>{let xx=20*devicePixelRatio+i*(W-40*devicePixelRatio)/(a.length-1),yy=H-25*devicePixelRatio-(x[j]/mx)*(H-50*devicePixelRatio);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke()})}
function renderSettings(){$('settings').innerHTML=`<div class="grid g2"><div class="card"><h2>💾 Backup / Restore</h2><div class="actions"><button class="btn primary" onclick="backup()">دانلود Backup</button><label class="btn">Restore<input type="file" accept=".json" hidden onchange="restore(event)"></label></div></div><div class="card"><h2>🗓 ماه گزارش</h2><input id="mi" type="month" value="${S.month}"><button class="btn" style="margin-top:7px" onclick="S.month=$('mi').value;save()">اعمال</button></div></div><div class="card section"><h2>📡 Live Crypto</h2><div class="row"><span>BTC/USDT</span><b id="btc">...</b></div><div class="row"><span>ETH/USDT</span><b id="eth">...</b></div><p class="mini">قیمت زنده کریپتو از Binance دریافت می‌شود. برای طلا/ارز/بورس/نفت باید API معتبر بازار مربوطه اضافه شود.</p></div><div class="card section"><h2>⚠️ حذف اطلاعات</h2><button class="btn danger" onclick="wipe()">حذف همه اطلاعات</button></div>`;live()}
function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='finora-backup.json';a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.wallet||!x.invest)throw 1;S=x;save();toast('Backup بازیابی شد')}catch(_){alert('فایل معتبر نیست')}};r.readAsText(f)}
function wipe(){if(confirm('همه اطلاعات حذف شود؟')){localStorage.removeItem(K);location.reload()}}
async function live(){try{let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbols=%5B%22BTCUSDT%22,%22ETHUSDT%22%5D'),a=await r.json(),m=Object.fromEntries(a.map(x=>[x.symbol,+x.price]));if($('btc'))$('btc').textContent='$'+m.BTCUSDT.toLocaleString();if($('eth'))$('eth').textContent='$'+m.ETHUSDT.toLocaleString()}catch(e){}}
function render(){renderHome();renderWallet();renderInvest();renderAnalysis();renderSettings()}render();
</script></body></html>
